<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">

  <!-- Anchor icon, centered at x=50 -->

  <!-- Ring -->
  <circle cx="50" cy="22" r="10" fill="none" stroke="#7A9E7E" stroke-width="2.8"/>

  <!-- Vertical shaft -->
  <line x1="50" y1="32" x2="50" y2="96" stroke="#7A9E7E" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Stock (horizontal crossbar) with round caps -->
  <line x1="20" y1="52" x2="80" y2="52" stroke="#7A9E7E" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Left arm / fluke -->
  <path d="M 50,96 C 48,109 18,109 13,87" fill="none" stroke="#7A9E7E" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Right arm / fluke -->
  <path d="M 50,96 C 52,109 82,109 87,87" fill="none" stroke="#7A9E7E" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Connecting bar at fluke tips -->
  <line x1="13" y1="87" x2="87" y2="87" stroke="#7A9E7E" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Thin vertical separator -->
  <line x1="106" y1="20" x2="106" y2="100" stroke="#D4CECC" stroke-width="1"/>

  <!-- SAILORS -->
  <text
    x="120"
    y="66"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="40"
    fill="#2C3E50"
    letter-spacing="3">SAILORS</text>

  <!-- CHIROPRACTIC -->
  <text
    x="122"
    y="87"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="13"
    fill="#7A9E7E"
    letter-spacing="6">CHIROPRACTIC</text>

</svg>
